<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>
  <!-- Background badge for contrast in both dark and light browser tabs -->
  <rect width="128" height="128" rx="28" fill="#ffffff" filter="url(#shadow)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Stylized PEX Lettermark in exact brand colors -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
    <!-- P in Deep Navy Blue -->
    <text x="18" y="78" fill="#09187c">P</text>
    <!-- E in Teal Navy -->
    <text x="49" y="78" fill="#09386e">E</text>
    <!-- X in Forest Pine Green -->
    <text x="80" y="78" fill="#08595c">X</text>
  </g>

  <!-- Agritech indicator dot -->
  <circle cx="106" cy="46" r="4.5" fill="#08595c" />
</svg>
