    P<tspan fill="#f58220">E</tspan>X
  </text>
  
  <!-- Agri green sprout / leaf accent -->
  <path d="M22 45 C 27 42, 37 42, 42 45 C 37 47.5, 27 47.5, 22 45 Z" fill="#22c55e" />
  
